services:
  mysql:
    image: mysql:8.0
    container_name: tour_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourguide_db}
      MYSQL_USER: ${MYSQL_USER:-tourguide}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tourguide_pass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Không publish port ra host — chỉ backend/celery_worker cần kết nối, đã
    # cùng Docker network rồi. `docker compose exec mysql mysql -u... ` để
    # debug thay vì connect từ host. (từng lộ port này ra 0.0.0.0 với password
    # mặc định yếu — sửa trong lúc /my-sec audit)
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tour_redis
    restart: always
    # Không publish port ra host — lý do tương tự mysql ở trên.

  # Sidecar Node.js bọc zca-js (unofficial Zalo Personal Client, hỗ trợ QR
  # login) — thư viện Python thuần (zlapi) KHÔNG hỗ trợ QR login nên tách
  # riêng service này, backend Python gọi qua HTTP nội bộ (ZALO_BRIDGE_URL).
  zalo_bridge:
    build: ./zalo-bridge
    container_name: tour_zalo_bridge
    restart: always
    environment:
      API_KEY: ${API_KEY}
    ports:
      - "4000:4000"
    volumes:
      - ./zalo-bridge/storage:/app/storage

  backend:
    build: ./backend
    container_name: tour_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      zalo_bridge:
        condition: service_started
    volumes:
      - ./backend:/app

  celery_worker:
    build: ./backend
    container_name: tour_celery_worker
    command: celery -A app.tasks.celery_worker worker --loglevel=info
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      zalo_bridge:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${API_KEY}
    container_name: tour_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
